name: FluxKit
options:
  bundleIdPrefix: cloud.fluxkit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios.git
    from: 5.102.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

# MARK: - 只改这一行 ------------------------------------------------------------
# 你的 10 位 Team ID（developer.apple.com/account → Membership details）。
# 本项目的 Bundle ID / App Group(group.cloud.fluxkit.app) / 描述文件都属于
# Team H5YQ9HSATA；应用和 Share Extension 共用这一个 Team，改这里两边都生效。
    DEVELOPMENT_TEAM: H5YQ9HSATA
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  FluxKit:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared
    dependencies:
      - target: FluxKitShare
      - package: RevenueCat
        product: RevenueCat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cloud.fluxkit.app
        PRODUCT_NAME: FluxKit
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_CFBundleDisplayName: FluxKit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # RevenueCat public SDK keys (safe to ship — they are not secrets).
        # Debug: Test Store key, purchases are simulated; lets you exercise the
        # Paywall in the simulator without an App Store sandbox account.
        Debug:
          REVENUECAT_API_KEY: "test_WjmvaCEvytrrgYhzAleOBCjtFmA"
        # Release: App Store key, real StoreKit purchases validated by RevenueCat.
        Release:
          REVENUECAT_API_KEY: "appl_itozUxxVurVFaVWfDpjnvwasyfD"
    entitlements:
      path: Sources/FluxKit.entitlements
      properties:
        com.apple.security.application-groups:
          - group.cloud.fluxkit.app
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: FluxKit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryAddUsageDescription: "FluxKit saves videos to your photo library only when you tap Save to Photos."
        NSPhotoLibraryUsageDescription: "FluxKit needs access to save downloaded videos to your photo library."
        CFBundleURLTypes:
          - CFBundleURLName: cloud.fluxkit.app.link
            CFBundleURLSchemes:
              - fluxkit
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Substituted from the per-configuration build setting above:
        # Debug → test_… (Test Store), Release → appl_… (App Store).
        REVENUECAT_API_KEY: "$(REVENUECAT_API_KEY)"
        # Legal links shown on the Paywall (App Review 3.1.2).
        SKPrivacyPolicyURL: "https://app.openkit.cloud/privacy-policy"
        SKTermsURL: "https://app.openkit.cloud/terms-of-service"
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false
    scheme:
      testTargets:
        - FluxKitTests
        - FluxKitUITests
      gatherCoverageData: true

  FluxKitShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cloud.fluxkit.app.share
        PRODUCT_NAME: FluxKitShare
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.cloud.fluxkit.app
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: FluxKit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true

  FluxKitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: FluxKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cloud.fluxkit.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FluxKit

  FluxKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: FluxKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cloud.fluxkit.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FluxKit.app/FluxKit"
        BUNDLE_LOADER: "$(TEST_HOST)"

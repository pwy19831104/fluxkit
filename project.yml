name: DownloadKit
options:
  bundleIdPrefix: com.downloadkit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  DownloadKit:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared
    dependencies:
      - target: DownloadKitShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.downloadkit.app
        PRODUCT_NAME: DownloadKit
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_CFBundleDisplayName: DownloadKit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: Sources/DownloadKit.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.downloadkit.app
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: DownloadKit
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryAddUsageDescription: "DownloadKit saves videos to your photo library only when you tap Save to Photos."
        NSPhotoLibraryUsageDescription: "DownloadKit needs access to save downloaded videos to your photo library."
        CFBundleURLTypes:
          - CFBundleURLName: com.downloadkit.app.link
            CFBundleURLSchemes:
              - downloadkit
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
    scheme:
      testTargets:
        - DownloadKitTests
      gatherCoverageData: true

  DownloadKitShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.downloadkit.app.share
        PRODUCT_NAME: DownloadKitShare
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.downloadkit.app
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: DownloadKit
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true

  DownloadKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: DownloadKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.downloadkit.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DownloadKit.app/DownloadKit"
        BUNDLE_LOADER: "$(TEST_HOST)"

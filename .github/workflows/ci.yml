name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          elif [ -d /Applications/Xcode_16.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.3.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Generate project
        run: xcodegen generate

      - name: Build static site
        run: |
          python3 scripts/build_site.py
          for p in / /privacy-policy /terms-of-service /support; do
            test -f "site${p%/}/index.html" || { echo "missing $p"; exit 1; }
          done

      - name: Boot simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          data=json.load(sys.stdin)["devices"]
          for runtime, devices in data.items():
              if "iOS" not in runtime: continue
              for d in devices:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); raise SystemExit
          ')
          echo "SIMULATOR_UDID=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b

      - name: Unit tests
        run: |
          xcodebuild test -project FluxKit.xcodeproj -scheme FluxKit \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -only-testing:FluxKitTests \
            CODE_SIGNING_ALLOWED=NO

      - name: UI tests
        run: |
          xcodebuild test -project FluxKit.xcodeproj -scheme FluxKit \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -only-testing:FluxKitUITests \
            CODE_SIGNING_ALLOWED=NO

      - name: Release build (compile check)
        run: |
          xcodebuild -project FluxKit.xcodeproj -scheme FluxKit \
            -configuration Release -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            build CODE_SIGNING_ALLOWED=NO

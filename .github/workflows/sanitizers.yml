name: Sanitizers

# Thread Sanitizer and Address Sanitizer are too slow for every push, but they are the only
# mechanical way to find the races in the download state machine and in the App Group hand-off.
# Nightly at 18:00 UTC (02:00 Beijing) plus manual runs.
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: sanitizers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanitize:
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ThreadSanitizer
            flag: -enableThreadSanitizer YES
          - name: AddressSanitizer
            flag: -enableAddressSanitizer YES
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          elif [ -d /Applications/Xcode_16.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.3.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Generate project
        run: xcodegen generate

      - name: Boot simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          data=json.load(sys.stdin)["devices"]
          for runtime, devices in data.items():
              if "iOS" not in runtime: continue
              for d in devices:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); raise SystemExit
          ')
          echo "SIMULATOR_UDID=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b

      - name: Unit tests under ${{ matrix.name }}
        run: |
          set -o pipefail
          xcodebuild test -project FluxKit.xcodeproj -scheme FluxKit \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -only-testing:FluxKitTests \
            CODE_SIGNING_ALLOWED=NO \
            ${{ matrix.flag }} | tee "sanitizer-${{ matrix.name }}.log"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-${{ matrix.name }}
          path: sanitizer-${{ matrix.name }}.log
          if-no-files-found: ignore

  strict-concurrency:
    # Compile-time warnings only: Swift 6 strict concurrency surfaces the isolation problems that
    # TSan cannot always see. Non-blocking on purpose so the signal is visible without gating.
    runs-on: macos-15
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build with Swift 6 strict concurrency
        run: |
          xcodebuild build -project FluxKit.xcodeproj -scheme FluxKit \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            SWIFT_STRICT_CONCURRENCY=complete \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee strict-concurrency.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-concurrency
          path: strict-concurrency.log
          if-no-files-found: ignore
